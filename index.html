<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LibreVPN — Свобода</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  
  :root {
    --bg-base: #f5f6fa; --bg-glass: rgba(255, 255, 255, 0.55); --bg-glass-heavy: rgba(255, 255, 255, 0.85);
    --bg-glass-card: rgba(255, 255, 255, 0.4); --border-glass: rgba(255, 255, 255, 0.9);
    --text-main: #1a1a2e; --text-muted: #5e6472; --primary: #6366f1; --primary-glow: #818cf8;
    --accent: #8b5cf6; --shadow: 0 8px 32px rgba(31, 38, 135, 0.08); --blur: blur(24px); --radius: 24px;
  }
  
  [data-theme="dark"] {
    --bg-base: #0b0714; --bg-glass: rgba(20, 15, 35, 0.55); --bg-glass-heavy: rgba(25, 18, 45, 0.85);
    --bg-glass-card: rgba(255, 255, 255, 0.04); --border-glass: rgba(255, 255, 255, 0.08);
    --text-main: #f8fafc; --text-muted: #94a3b8; --primary: #8b5cf6; --primary-glow: #a78bfa;
    --accent: #6366f1; --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
  }

  body {
    font-family: 'Inter', sans-serif; background-color: var(--bg-base); color: var(--text-main);
    min-height: 100vh; overflow-x: hidden; transition: background-color 0.5s, color 0.5s;
  }

  #bg-canvas { position: fixed; inset: 0; z-index: -1; width: 100%; height: 100%; pointer-events: none; }

  .header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center;
    padding: 16px 20px; background: var(--bg-glass); backdrop-filter: var(--blur);
    border-bottom: 1px solid var(--border-glass);
  }
  .logo-area { display: flex; align-items: center; gap: 12px; cursor: pointer; }
  .logo-img { width: 40px; height: 40px; border-radius: 12px; object-fit: cover; background: var(--primary); padding: 4px; }
  .logo-text { font-size: 20px; font-weight: 800; background: linear-gradient(135deg, var(--primary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .header-actions { display: flex; gap: 10px; align-items: center; }
  .icon-btn { background: var(--bg-glass-card); border: 1px solid var(--border-glass); color: var(--text-main); width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; }
  .icon-btn:active { transform: scale(0.9); }

  .sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 998; opacity: 0; pointer-events: none; transition: opacity 0.3s; backdrop-filter: blur(4px); }
  .sidebar-overlay.open { opacity: 1; pointer-events: auto; }
  .sidebar { position: fixed; top: 0; left: 0; width: 290px; height: 100vh; z-index: 999; background: var(--bg-glass-heavy); backdrop-filter: blur(30px); border-right: 1px solid var(--border-glass); transform: translateX(-100%); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); display: flex; flex-direction: column; box-shadow: var(--shadow); }
  .sidebar.open { transform: translateX(0); }
  .s-header { padding: 24px 20px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border-glass); }
  .s-nav { flex: 1; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 6px; }
  .nav-btn { display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 16px; border-radius: 16px; border: none; background: transparent; color: var(--text-main); font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s; text-align: left; }
  .nav-btn.active { background: var(--bg-glass-card); color: var(--primary); border: 1px solid var(--border-glass); }
  
  .admin-btn { background: linear-gradient(135deg, #ef4444, #b91c1c) !important; color: #fff !important; font-weight: 800; margin-bottom: 10px; border: 1px solid #f87171 !important; }
  .admin-btn:active { transform: scale(0.97); }

  .main-content { padding: 100px 20px 40px; max-width: 700px; margin: 0 auto; }
  .page { display: none; opacity: 0; transform: translateY(20px); transition: all 0.4s ease-out; }
  .page.active { display: block; opacity: 1; transform: translateY(0); }

  .glass-card { background: var(--bg-glass); border: 1px solid var(--border-glass); border-radius: var(--radius); padding: 24px; margin-bottom: 20px; backdrop-filter: var(--blur); box-shadow: var(--shadow); }
  .h-title { font-size: 24px; font-weight: 800; margin-bottom: 8px; }
  
  /* Админка */
  .admin-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 20px; }
  .stat-box { background: var(--bg-glass-card); border: 1px solid var(--border-glass); border-radius: 16px; padding: 12px; text-align: center; }
  .stat-val { font-size: 20px; font-weight: 800; color: var(--primary); }
  .stat-lbl { font-size: 10px; color: var(--text-muted); text-transform: uppercase; }

  .admin-tabs { display: flex; gap: 6px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 4px; }
  .admin-tab { padding: 10px 16px; border-radius: 12px; background: var(--bg-glass-card); border: 1px solid var(--border-glass); color: var(--text-main); cursor: pointer; font-weight: 600; white-space: nowrap; font-size: 13px; }
  .admin-tab.active { background: #ef4444; color: #fff; }
  .admin-section { display: none; }
  .admin-section.active { display: block; }
  
  .user-row { display: flex; flex-direction: column; gap: 8px; padding: 12px; background: var(--bg-glass-card); border-radius: 12px; margin-bottom: 8px; font-size: 13px; border: 1px solid var(--border-glass); }
  .user-header { display: flex; justify-content: space-between; align-items: center; }
  .user-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .user-actions button, .user-actions select { padding: 6px 10px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; font-size: 11px; }
  .btn-grant { background: #10b981; color: #fff; }
  .btn-ban { background: #ef4444; color: #fff; }
  .btn-unban { background: #f59e0b; color: #fff; }
  
  .admin-input { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--border-glass); background: var(--bg-glass); color: var(--text-main); margin-bottom: 12px; outline: none; }
  .btn { display: flex; align-items: center; justify-content: center; width: 100%; padding: 16px; border-radius: 16px; border: none; background: linear-gradient(135deg, var(--primary), var(--accent)); color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; }
  
  .toast { position: fixed; bottom: 30px; left: 50%; transform: translate(-50%, 20px); background: var(--text-main); color: var(--bg-base); padding: 14px 28px; border-radius: 30px; font-weight: 700; opacity: 0; transition: 0.3s; z-index: 2000; pointer-events: none; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div class="header">
  <div class="logo-area" onclick="nav('home')">
    <img src="https://i.ibb.co/3WqXGqZ/logo.png" alt="LibreVPN" class="logo-img">
    <div class="logo-text">LibreVPN</div>
  </div>
  <div class="header-actions">
    <button class="icon-btn" onclick="toggleTheme()" id="theme-btn">🌙</button>
    <button class="icon-btn" onclick="toggleMenu()">☰</button>
  </div>
</div>

<div class="sidebar-overlay" id="overlay" onclick="toggleMenu()"></div>
<div class="sidebar" id="sidebar">
  <div class="s-header">
    <img src="https://i.ibb.co/3WqXGqZ/logo.png" style="width:32px;height:32px;border-radius:8px;">
    <h2 style="font-size:18px;font-weight:800;">LibreVPN</h2>
  </div>
  <div class="s-nav">
    <button class="nav-btn admin-btn" onclick="askAdminPass()">🛡️ АДМИН-ПАНЕЛЬ</button>
    <button class="nav-btn active" onclick="nav('home', this)">🏠 Главная</button>
    <button class="nav-btn" onclick="nav('srv-all', this)">⚡ Сервера</button>
    <button class="nav-btn" onclick="nav('news', this)">📰 Новости</button>
  </div>
</div>

<div class="main-content">
  <div id="page-home" class="page active"><h1 class="h-title">LibreVPN</h1><div class="glass-card"><p>Все системы работают.</p></div></div>
  <div id="page-srv-all" class="page"><h1 class="h-title">Сервера</h1><div id="srv-container"></div></div>
  <div id="page-news" class="page"><h1 class="h-title">Новости</h1><div id="news-container"></div></div>

  <!-- АДМИН ПАНЕЛЬ -->
  <div id="page-admin" class="page">
    <h1 class="h-title" style="color:#ef4444;">Админ-панель</h1>
    
    <div class="admin-stats">
      <div class="stat-box"><div class="stat-val" id="stat-visits">0</div><div class="stat-lbl">Заходов</div></div>
      <div class="stat-box"><div class="stat-val" id="stat-unique">0</div><div class="stat-lbl">IP</div></div>
      <div class="stat-box"><div class="stat-val" id="stat-subs">0</div><div class="stat-lbl">Подписок</div></div>
    </div>

    <div class="admin-tabs">
      <div class="admin-tab active" onclick="switchAdmin('users', this)">Юзеры</div>
      <div class="admin-tab" onclick="switchAdmin('servers', this)">Сервера</div>
      <div class="admin-tab" onclick="switchAdmin('news', this)">Новости</div>
      <div class="admin-tab" onclick="switchAdmin('tools', this)">Инструменты</div>
    </div>

    <!-- ЮЗЕРЫ -->
    <div id="admin-users" class="admin-section active">
      <input type="text" class="admin-input" placeholder="Поиск по IP или ID..." oninput="filterUsers(this.value)">
      <div id="admin-user-list">Загрузка...</div>
      <button class="btn" style="background:#0284c7; margin-top:10px;" onclick="exportCSV()">📥 Экспорт в CSV</button>
    </div>

    <!-- СЕРВЕРА -->
    <div id="admin-servers" class="admin-section">
      <div class="glass-card">
        <input type="text" id="srv-name" class="admin-input" placeholder="Название">
        <input type="text" id="srv-country" class="admin-input" placeholder="Флаг">
        <input type="text" id="srv-proto" class="admin-input" placeholder="Протокол">
        <input type="text" id="srv-key" class="admin-input" placeholder="Ключ">
        <button class="btn" onclick="addServer()">Добавить</button>
      </div>
      <div id="admin-srv-list">Загрузка...</div>
    </div>

    <!-- НОВОСТИ -->
    <div id="admin-news" class="admin-section">
      <div class="glass-card">
        <input type="text" id="news-title" class="admin-input" placeholder="Заголовок">
        <input type="text" id="news-body" class="admin-input" placeholder="Текст">
        <button class="btn" onclick="addNews()">Опубликовать</button>
      </div>
      <div id="admin-news-list">Загрузка...</div>
    </div>

    <!-- ИНСТРУМЕНТЫ -->
    <div id="admin-tools" class="admin-section">
      <div class="glass-card">
        <h3 style="margin-bottom:12px;">Рассылка</h3>
        <input type="text" id="bc-msg" class="admin-input" placeholder="Текст уведомления">
        <button class="btn" onclick="sendBroadcast()">Отправить всем</button>
      </div>
      <div class="glass-card">
        <h3 style="margin-bottom:12px;">Настройки сайта</h3>
        <input type="text" id="set-title" class="admin-input" placeholder="Заголовок сайта">
        <button class="btn" onclick="saveSettings()">Сохранить</button>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast">Готово</div>

<script>
let isAdmin = false;
let adminUsersData = [];

const toggleTheme = () => {
  const body = document.body; const btn = document.getElementById('theme-btn');
  if (body.getAttribute('data-theme') === 'dark') { body.removeAttribute('data-theme'); btn.textContent = '🌙'; localStorage.setItem('theme', 'light'); }
  else { body.setAttribute('data-theme', 'dark'); btn.textContent = '☀️'; localStorage.setItem('theme', 'dark'); }
};
if (localStorage.getItem('theme') === 'dark') { document.body.setAttribute('data-theme', 'dark'); document.getElementById('theme-btn').textContent = '☀️'; }

const toggleMenu = () => { document.getElementById('sidebar').classList.toggle('open'); document.getElementById('overlay').classList.toggle('open'); };
const nav = (pageId, btn) => {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  const target = document.getElementById('page-' + pageId);
  if (target) { target.classList.add('active'); window.scrollTo({ top: 0, behavior: 'smooth' }); }
  if (btn) btn.classList.add('active');
  if (window.innerWidth < 768) toggleMenu();
};

// ==== ВХОД В АДМИНКУ ====
const askAdminPass = () => {
  const pass = prompt('Введите пароль администратора:');
  if (pass === '1742staW02') {
    isAdmin = true;
    nav('admin');
    loadAdminData();
  } else if (pass !== null) showToast('❌ Неверный пароль');
};

const switchAdmin = (tab, btn) => {
  document.querySelectorAll('.admin-tab').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.admin-section').forEach(s => s.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('admin-' + tab).classList.add('active');
};

// ==== ЗАГРУЗКА ДАННЫХ ====
const loadAdminData = async () => {
  // Юзеры
  try {
    const res = await fetch('/api/admin/users');
    adminUsersData = await res.json();
    renderUsers(adminUsersData);
    
    document.getElementById('stat-visits').textContent = adminUsersData.length;
    document.getElementById('stat-unique').textContent = new Set(adminUsersData.map(u => u.ip)).size;
    document.getElementById('stat-subs').textContent = adminUsersData.filter(u => u.plan !== 'Free').length;
  } catch (e) { console.error(e); }

  // Сервера
  try {
    const res = await fetch('/api/servers?admin=true');
    const servers = await res.json();
    document.getElementById('admin-srv-list').innerHTML = servers.map(s => `
      <div class="user-row">
        <div class="user-header"><div>${s.country} ${s.name} (${s.protocol})</div><div style="color:${s.active ? '#10b981' : '#ef4444'}; font-weight:800;">${s.active ? 'Вкл' : 'Выкл'}</div></div>
        <div class="user-actions">
          <button class="btn-grant" style="background:${s.active ? '#f59e0b' : '#10b981'}" onclick="toggleServer(${s.id}, ${!s.active})">${s.active ? 'Выкл' : 'Вкл'}</button>
          <button class="btn-ban" onclick="deleteServer(${s.id})">Удалить</button>
        </div>
      </div>
    `).join('');
  } catch (e) { console.error(e); }

  // Новости
  try {
    const res = await fetch('/api/news');
    const news = await res.json();
    document.getElementById('admin-news-list').innerHTML = news.map(n => `
      <div class="user-row">
        <div class="user-header"><div>${n.title}</div></div>
        <div style="font-size:11px; color:var(--text-muted);">${n.body}</div>
        <div class="user-actions"><button class="btn-ban" onclick="deleteNews(${n.id})">Удалить</button></div>
      </div>
    `).join('');
  } catch (e) { console.error(e); }
};

const renderUsers = (users) => {
  document.getElementById('admin-user-list').innerHTML = users.map(u => `
    <div class="user-row">
      <div class="user-header">
        <div><strong>ID: ${u.id}</strong> | IP: ${u.ip}</div>
        <div style="font-weight:800; color:${u.plan === 'Free' ? 'var(--text-muted)' : '#10b981'};">${u.plan}</div>
      </div>
      <div style="font-size:11px; color:var(--text-muted);">${new Date(u.created_at).toLocaleString()} | Статус: ${u.status}</div>
      <div class="user-actions">
        <select onchange="grantSub(${u.id}, this.value)">
          <option value="" disabled selected>Выдать</option>
          <option value="Free">Free</option>
          <option value="Plus">Plus</option>
          <option value="Black">Black</option>
        </select>
        ${u.status === 'active' ? `<button class="btn-ban" onclick="banUser(${u.id}, 'banned')">Бан</button>` : `<button class="btn-unban" onclick="banUser(${u.id}, 'active')">Разбан</button>`}
        <button class="btn-ban" style="background:#64748b;" onclick="deleteUser(${u.id})">Удалить</button>
      </div>
    </div>
  `).join('');
};

const filterUsers = (q) => {
  renderUsers(adminUsersData.filter(u => u.ip.includes(q) || u.id.toString().includes(q)));
};

// ==== ДЕЙСТВИЯ ====
const grantSub = async (id, plan) => { await fetch('/api/admin/grant', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id, plan }) }); showToast(`✅ Тариф ${plan} выдан`); loadAdminData(); };
const banUser = async (id, status) => { await fetch('/api/admin/ban', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id, status }) }); showToast('✅ Статус обновлен'); loadAdminData(); };
const deleteUser = async (id) => { if(confirm('Удалить?')) { await fetch('/api/admin/delete-user', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id }) }); loadAdminData(); } };

const addServer = async () => {
  const name = document.getElementById('srv-name').value;
  const country = document.getElementById('srv-country').value;
  const protocol = document.getElementById('srv-proto').value;
  const key = document.getElementById('srv-key').value;
  if (!name || !key) return showToast('Заполните поля');
  await fetch('/api/admin/servers', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, country, protocol, key }) });
  loadAdminData();
};

const toggleServer = async (id, active) => { await fetch('/api/admin/servers/' + id, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ active }) }); loadAdminData(); };
const deleteServer = async (id) => { await fetch('/api/admin/servers/' + id, { method: 'DELETE' }); loadAdminData(); };

const addNews = async () => {
  const title = document.getElementById('news-title').value;
  const body = document.getElementById('news-body').value;
  if (!title) return showToast('Введите заголовок');
  await fetch('/api/admin/news', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title, body, date: new Date().toLocaleDateString() }) });
  loadAdminData();
};

const deleteNews = async (id) => { await fetch('/api/admin/news/' + id, { method: 'DELETE' }); loadAdminData(); };

const sendBroadcast = async () => {
  const msg = document.getElementById('bc-msg').value;
  if (!msg) return showToast('Введите текст');
  await fetch('/api/admin/broadcast', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: msg }) });
  showToast('✅ Рассылка отправлена');
};

const saveSettings = async () => {
  const title = document.getElementById('set-title').value;
  await fetch('/api/admin/settings', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key: 'site_title', value: title }) });
  showToast('✅ Настройки сохранены');
};

const exportCSV = () => {
  const csv = "ID,IP,Тариф,Статус,Дата\n" + adminUsersData.map(u => `${u.id},${u.ip},${u.plan},${u.status},${new Date(u.created_at).toLocaleString()}`).join("\n");
  const blob = new Blob([csv], { type: 'text/csv' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'users.csv'; a.click();
};

// ==== ФРОНТ ====
fetch('/api/visit', { method: 'POST' }).catch(() => {});
const loadNews = async () => {
  try {
    const res = await fetch('/api/news');
    const news = await res.json();
    document.getElementById('news-container').innerHTML = news.map(n => `<div class="glass-card"><div style="font-weight:700;">${n.title}</div><div style="font-size:12px; color:var(--text-muted);">${n.body}</div></div>`).join('');
  } catch(e) {}
};
loadNews();

const loadSiteServers = async () => {
  try {
    const res = await fetch('/api/servers');
    const servers = await res.json();
    document.getElementById('srv-container').innerHTML = servers.map(s => `<div class="glass-card" onclick="cUrl('${s.key}', '${s.name}')"><div style="font-weight:700;">${s.country} ${s.name}</div><div style="font-size:10px; color:var(--primary);">${s.protocol}</div></div>`).join('');
  } catch(e) {}
};
loadSiteServers();

const showToast = (msg) => { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2000); };
const cUrl = (key, name) => { navigator.clipboard.writeText(key).then(() => showToast('✅ ' + name + ' скопирован')); };

// Фон
const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');
let particles = [];
const resize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
window.addEventListener('resize', resize); resize();
for(let i=0; i<40; i++) particles.push({x: Math.random()*canvas.width, y: Math.random()*canvas.height, vx: (Math.random()-0.5)*0.5, vy: (Math.random()-0.5)*0.5, r: Math.random()*2+1});
const animate = () => {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  particles.forEach(p => {
    p.x+=p.vx; p.y+=p.vy;
    if(p.x<0||p.x>canvas.width) p.vx*=-1;
    if(p.y<0||p.y>canvas.height) p.vy*=-1;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle = document.body.getAttribute('data-theme') === 'dark' ? 'rgba(139,92,246,0.5)' : 'rgba(99,102,241,0.2)';
    ctx.fill();
  });
  requestAnimationFrame(animate);
};
animate();
</script>
</body>
</html>
